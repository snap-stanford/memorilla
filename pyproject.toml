[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorilla"
dynamic = ["version"]
description = "Memorilla: Latent Semantic Memory for LLMs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch==2.7.0",
    "vllm==0.9.1",
    "transformers==4.53.3",
    "lightning==2.6.1",
    "datasets==4.1.1",
    "safetensors>=0.5.3",
    "huggingface_hub>=0.36.0,<1.0",
    "numpy>=1.26,<2",
    "pyarrow>=21.0.0",
    "nltk>=3.9.2",
    "rouge-score>=0.1.2",
    "pyyaml>=6.0",
    "filelock>=3.12",
    "tqdm>=4.66",
]

[project.optional-dependencies]
wandb = ["wandb"]
dev = ["pytest", "ruff", "black", "pre-commit"]
personalizationv4 = ["openai"]
rl = ["textworld==1.7.0"]

[tool.uv]
override-dependencies = ["nvidia-nccl-cu12==2.27.3"]  # PyTorch 2.7 ships NCCL 2.26, which can hang multi-GPU runs

[project.urls]
Homepage = "https://github.com/snap-stanford/memorilla"
Issues = "https://github.com/snap-stanford/memorilla/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["memorilla*"]

[tool.setuptools.dynamic]
version = { attr = "memorilla.__version__" }

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # black wraps code at 120 characters; long prompt strings are kept verbatim
]

[tool.ruff.lint.isort]
known-first-party = ["memorilla", "personalizationv4"]
force-sort-within-sections = true
